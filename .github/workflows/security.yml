name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-and-workflow-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy misconfiguration scan on Docker & Compose files
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: docker
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Run actionlint on GitHub Actions workflows
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp
          /tmp/actionlint -color

      - name: Run offline security regression suite
        run: bash scripts/test-security-regression.sh
