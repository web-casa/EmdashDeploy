# EmdashDeploy 1.6.0-hi.3 — Multi-service / Multi-instance Docker Compose Stack
#
# Designed to coexist cleanly with other services on the same host:
#   - Uses prebuilt multi-arch GHCR images by default (never mixes image + build)
#   - For local builds or mainland China mirrors, layer compose.build.yml:
#       docker compose -f compose.yml -f compose.build.yml up -d --build
#   - For custom EmDash site repositories, layer compose.custom-site.yml
#   - Does NOT bind host 80/443 by default (only binds ${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000})
#   - Supports multiple isolated EmDash instances on one server via COMPOSE_PROJECT_NAME + APP_PORT
#   - Optional profiles: --profile postgres --profile valkey --profile caddy
#   - External reverse-proxy network overlay: compose.proxy-net.yml

services:
  emdash:
    image: ${EMDASH_IMAGE:-ghcr.io/web-casa/emdash-deploy:1.6.0-hi.3-blog-sqlite}
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      TZ: ${TIMEZONE:-UTC}
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      ENABLE_PLUGIN_SANDBOX: ${ENABLE_PLUGIN_SANDBOX:-1}
      EMDASH_AUTO_MIGRATE: ${EMDASH_AUTO_MIGRATE:-1}
      APP_PUBLIC_URL: ${EMDASH_SITE_URL:-http://127.0.0.1:3000}
      EMDASH_SITE_URL: ${EMDASH_SITE_URL:-http://127.0.0.1:3000}
      SITE_URL: ${EMDASH_SITE_URL:-http://127.0.0.1:3000}
      EMDASH_ENCRYPTION_KEY: ${EMDASH_ENCRYPTION_KEY:-}
      EMDASH_AUTH_SECRET: ${EMDASH_AUTH_SECRET:-}
      EMDASH_PREVIEW_SECRET: ${EMDASH_PREVIEW_SECRET:-}
      SQLITE_PATH: /data/sqlite/data.db
      UPLOADS_DIR: /data/uploads
      SESSIONS_DIR: /data/sessions
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PG_DB_NAME: ${PG_DB_NAME:-emdash}
      PG_DB_USER: ${PG_DB_USER:-emdash}
      PG_DB_PASSWORD: ${PG_DB_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-valkey}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_URL: ${REDIS_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    volumes:
      - emdash_data:/data
    networks:
      - emdash_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB_NAME:-emdash}
      POSTGRES_USER: ${PG_DB_USER:-emdash}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD:-}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - emdash_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER:-emdash} -d ${PG_DB_NAME:-emdash}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ["valkey"]
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - 'test -n "$$REDIS_PASSWORD" || { echo "ERROR: Set REDIS_PASSWORD in .env when enabling valkey profile" >&2; exit 1; }; exec valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - valkey_data:/data
    networks:
      - emdash_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      emdash:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - emdash_internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  emdash_data:
  postgres_data:
  valkey_data:
  caddy_data:
  caddy_config:

networks:
  emdash_internal:
    driver: bridge
